  <path d="M186 226 q14 10 28 0" stroke="#7a4ea0" stroke-width="4" fill="none"/>
  <!-- 下颌甲 -->
  <path d="M168 240 Q200 258 232 240 L232 252 Q200 270 168 252 Z" fill="#241a38"/>
