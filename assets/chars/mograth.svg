  <ellipse cx="200" cy="196" rx="60" ry="66" fill="#181028"/>
  <path d="M140 190 Q136 108 200 96 Q264 108 260 190 Q250 140 224 130 Q230 148 218 156 Q206 124 176 136 Q158 146 154 172 Q146 178 140 190 Z" fill="#0e0818"/>
