  <path d="M148 140 Q108 116 104 58 Q130 76 142 62 Q142 108 168 126 Z" fill="#241a38" stroke="#4d3572" stroke-width="3"/>
  <path d="M252 140 Q292 116 296 58 Q270 76 258 62 Q258 108 232 126 Z" fill="#241a38" stroke="#4d3572" stroke-width="3"/>
  <path d="M200 96 L212 60 L200 74 L188 60 Z" fill="#4d3572"/>
