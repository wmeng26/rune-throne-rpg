<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="0 0 400 480">
  <defs>
    <radialGradient id="mbg" cx=".5" cy=".4" r=".75">
      <stop offset="0" stop-color="#2c1838"/><stop offset=".6" stop-color="#180d26"/><stop offset="1" stop-color="#0c0714"/>
    </radialGradient>
    <linearGradient id="marmor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a34"/><stop offset="1" stop-color="#100a1c"/>
    </linearGradient>
    <radialGradient id="meye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e0a8ff"/><stop offset=".4" stop-color="#b06ad6" stop-opacity=".7"/><stop offset="1" stop-color="#b06ad6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="480" fill="url(#mbg)"/>
  <!-- 弥散紫雾 -->
  <ellipse cx="200" cy="300" rx="190" ry="170" fill="url(#meye)" opacity=".35"/>
  <!-- 漆黑披风（破裂边缘） -->
  <path d="M40 480 Q60 340 130 306 Q200 282 270 306 Q340 340 360 480 L330 480 Q320 380 290 350 L310 480 L270 480 Q268 400 250 360 L240 480 L200 470 L160 480 L150 360 Q132 400 130 480 L90 480 L110 350 Q80 380 70 480 Z" fill="#0c0616"/>
