    <circle cx="-12" cy="-8" r="2.6"/><circle cx="12" cy="-8" r="2.6"/>
  </g>
  <!-- 肩甲尖刺 -->
  <path d="M112 330 Q92 300 108 262 Q136 276 142 322 Z" fill="#1a1028" stroke="#3d2a5c" stroke-width="3"/>
  <path d="M288 330 Q308 300 292 262 Q264 276 258 322 Z" fill="#1a1028" stroke="#3d2a5c" stroke-width="3"/>
