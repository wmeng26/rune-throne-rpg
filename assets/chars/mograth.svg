  <ellipse cx="176" cy="192" rx="16" ry="10" fill="url(#meye)"/>
  <ellipse cx="224" cy="192" rx="16" ry="10" fill="url(#meye)"/>
  <path d="M162 190 q14 -10 28 0" stroke="#e0a8ff" stroke-width="4" fill="none" opacity=".95"/>
