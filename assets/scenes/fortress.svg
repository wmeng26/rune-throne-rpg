      <stop offset="0" stop-color="#120a20"/><stop offset=".55" stop-color="#1e1030"/><stop offset="1" stop-color="#2a1440"/>
    </linearGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1528"/><stop offset="1" stop-color="#0e0a18"/>
