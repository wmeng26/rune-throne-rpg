    </linearGradient>
    <linearGradient id="mwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8272"/><stop offset="1" stop-color="#565040"/>
    </linearGradient>
    <linearGradient id="mroof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4a38"/><stop offset="1" stop-color="#382c1e"/>
