<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35506b"/><stop offset=".6" stop-color="#6a7f94"/><stop offset="1" stop-color="#a8b6b8"/>
    </linearGradient>
    <linearGradient id="hwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6072"/><stop offset="1" stop-color="#22424f"/>
    </linearGradient>
    <linearGradient id="hwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5c40"/><stop offset="1" stop-color="#4a3826"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#hsky)"/>
  <!-- 晚霞 -->
  <circle cx="920" cy="180" r="52" fill="#e8c98a" opacity=".85"/>
  <g fill="#d8b488" opacity=".45">
    <ellipse cx="820" cy="200" rx="180" ry="14"/><ellipse cx="1000" cy="230" rx="220" ry="16"/>
  </g>
  <!-- 海面 -->
  <rect y="330" width="1200" height="345" fill="url(#hwater)"/>
  <g stroke="#cfe4e8" stroke-width="3" opacity=".4" fill="none" stroke-linecap="round">
    <path d="M140 400 h90"/><path d="M460 430 h110"/><path d="M820 410 h80"/><path d="M1020 450 h70"/>
  </g>
  <!-- 远处渔船 -->
  <g transform="translate(180 330)">
    <path d="M0 20 L110 20 L96 42 L14 42 Z" fill="#33424e"/>
    <rect x="50" y="-34" width="6" height="54" fill="#26333c"/>
    <path d="M56 -30 L96 8 L56 8 Z" fill="#e8dcc0"/>
  </g>
  <!-- 码头木栈桥 -->
  <path d="M420 675 L470 470 L560 470 L610 675 Z" fill="url(#hwood)"/>
  <g stroke="#38291a" stroke-width="5" opacity=".8">
    <line x1="460" y1="500" x2="570" y2="500"/><line x1="450" y1="550" x2="580" y2="550"/><line x1="436" y1="606" x2="596" y2="606"/>
  </g>
  <g stroke="#2e2114" stroke-width="7">
    <line x1="480" y1="470" x2="470" y2="560"/><line x1="556" y1="470" x2="566" y2="560"/>
  </g>
  <!-- 渔家小屋群 -->
  <g>
    <path d="M640 330 L820 330 L820 470 L640 470 Z" fill="#8a705a"/>
    <path d="M620 336 L730 262 L840 336 Z" fill="#5a4331"/>
    <rect x="700" y="400" width="60" height="70" fill="#3c2c1e"/>
    <rect x="660" y="360" width="40" height="34" fill="#e8c96a" opacity=".9"/>
    <rect x="760" y="360" width="40" height="34" fill="#e8c96a" opacity=".7"/>
    <path d="M840 350 L990 350 L990 470 L840 470 Z" fill="#77604c"/>
    <path d="M826 356 L915 296 L1004 356 Z" fill="#4c3826"/>
    <rect x="890" y="300" width="18" height="44" fill="#8d5a3a"/>
    <rect x="870" y="396" width="44" height="38" fill="#e8c96a" opacity=".75"/>
  </g>
  <!-- 系船柱与缆绳 -->
  <g>
    <rect x="430" y="430" width="18" height="52" rx="8" fill="#2e2114"/>
    <path d="M439 436 Q560 380 660 430" stroke="#261a0e" stroke-width="6" fill="none"/>
  </g>
  <!-- 灯笼 -->
  <g>
    <line x1="660" y1="470" x2="660" y2="400" stroke="#2e2114" stroke-width="6"/>
    <circle cx="660" cy="390" r="14" fill="#e8a24a"/>
    <circle cx="660" cy="390" r="22" fill="#e8a24a" opacity=".25"/>
  </g>
  <!-- 桅杆与鸥 -->
  <g stroke="#33424e" stroke-width="6"><line x1="300" y1="500" x2="300" y2="360"/></g>
  <g stroke="#eef4f6" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M540 210 q12 -10 24 0 q12 -10 24 0"/><path d="M820 160 q11 -9 22 0 q11 -9 22 0"/>
  </g>
  <ellipse cx="600" cy="640" rx="700" ry="40" fill="#0e1a22" opacity=".25"/>
</svg>
