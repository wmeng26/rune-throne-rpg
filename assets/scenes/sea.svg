<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="ssky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e4a5e"/><stop offset=".55" stop-color="#4d7286"/><stop offset="1" stop-color="#87a8b4"/>
    </linearGradient>
    <linearGradient id="ssea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d6b7e"/><stop offset=".5" stop-color="#2c5568"/><stop offset="1" stop-color="#1d3d4e"/>
    </linearGradient>
    <linearGradient id="srock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7078"/><stop offset="1" stop-color="#3a3f48"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ssky)"/>
  <!-- 远云 -->
  <g fill="#c9d4d8" opacity=".5">
    <ellipse cx="300" cy="120" rx="240" ry="16"/><ellipse cx="860" cy="90" rx="280" ry="18"/><ellipse cx="600" cy="180" rx="200" ry="12"/>
  </g>
  <!-- 远海 -->
  <rect y="300" width="1200" height="375" fill="url(#ssea)"/>
  <!-- 海平线光 -->
  <rect y="296" width="1200" height="6" fill="#dce9ec" opacity=".7"/>
  <!-- 波光 -->
  <g stroke="#bfe0e4" stroke-width="4" opacity=".55" fill="none" stroke-linecap="round">
    <path d="M120 360 h90"/><path d="M420 340 h70"/><path d="M760 370 h100"/><path d="M980 350 h60"/>
    <path d="M240 420 h110"/><path d="M600 430 h80"/><path d="M900 440 h90"/>
    <path d="M160 500 h120"/><path d="M520 520 h90"/><path d="M820 510 h110"/>
  </g>
  <!-- 浪沫 -->
  <g fill="#e8f2f4" opacity=".85">
    <ellipse cx="300" cy="560" rx="70" ry="10"/><ellipse cx="700" cy="590" rx="90" ry="12"/><ellipse cx="1020" cy="560" rx="60" ry="9"/>
  </g>
  <!-- 海风岬 -->
  <path d="M-20 675 L-20 320 L60 260 L180 300 L240 420 L220 675 Z" fill="url(#srock)"/>
  <path d="M-20 320 L60 260 L180 300 L240 420 L210 675 L-20 675 Z" fill="none" stroke="#2c3038" stroke-width="8"/>
  <g stroke="#2c3038" stroke-width="4" opacity=".7" fill="none">
    <path d="M40 380 l40 40 l-16 50"/><path d="M120 440 l30 50 l-24 60"/>
  </g>
  <!-- 岬角风向标 -->
  <g>
    <line x1="90" y1="300" x2="90" y2="220" stroke="#262a30" stroke-width="7"/>
    <path d="M90 220 L128 232 L90 246 Z" fill="#c9a227"/>
    <circle cx="90" cy="212" r="9" fill="#c9a227"/>
  </g>
  <!-- 礁石群 -->
  <g>
    <path d="M420 675 L460 560 L520 520 L590 560 L620 675 Z" fill="url(#srock)"/>
    <path d="M820 675 L850 600 L910 580 L960 620 L980 675 Z" fill="#4a4f58"/>
    <path d="M1040 675 L1070 620 L1130 610 L1180 650 L1200 675 Z" fill="#3a3f48"/>
  </g>
  <!-- 低飞的鸥群 -->
  <g stroke="#eef4f6" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M340 220 q14 -12 28 0 q14 -12 28 0"/>
    <path d="M470 180 q12 -10 24 0 q12 -10 24 0"/>
    <path d="M940 210 q13 -11 26 0 q13 -11 26 0"/>
  </g>
  <!-- 海雾 -->
  <ellipse cx="600" cy="620" rx="720" ry="56" fill="#dce9ec" opacity=".16"/>
  <ellipse cx="600" cy="540" rx="560" ry="34" fill="#dce9ec" opacity=".12"/>
</svg>
